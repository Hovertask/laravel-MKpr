version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "chore/datafactor-readiness-20261028"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "chore/datafactor-readiness-20261028"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

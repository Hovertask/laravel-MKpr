name: PHP checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, sqlite3, pdo_sqlite, pgsql, pdo_pgsql, gd, intl
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run database-independent regression tests
        run: php artisan test --testsuite=Unit
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
      - name: Run webhook security feature tests
        run: php artisan test tests/Feature/PaystackWebhookSecurityTest.php tests/Feature/PaystackWebhookIdempotencyTest.php tests/Feature/PublicEndpointSecurityTest.php tests/Feature/WalletPaymentReferenceTest.php tests/Feature/WalletVerificationFailureTest.php
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
